<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RK Creative Studio — Portfolio Admin</title><style>body{font-family:Arial,sans-serif;background:#080b12;color:#f4f6fa;margin:0;padding:30px}.box{max-width:560px;margin:auto;background:#111826;border:1px solid #263142;border-radius:18px;padding:28px}h1{margin-top:0}label{display:block;margin:18px 0 7px;color:#aab3c0;font-size:13px}input,select,button{width:100%;padding:13px;border-radius:9px;border:1px solid #344054;background:#0b1018;color:#fff;box-sizing:border-box}button{margin-top:22px;background:#d8b36a;color:#111;font-weight:700;cursor:pointer}.note{font-size:12px;color:#8994a5;line-height:1.6}.status{margin-top:18px;padding:12px;border-radius:8px;background:#0b1018;color:#aab3c0}</style></head><body><div class="box"><h1>RK Creative Studio</h1><p>Portfolio Image Manager</p><p class="note">Use your admin credentials to upload a design. Your GitHub token stays on Netlify and is never exposed in this page.</p><form id="form"><label>Admin ID</label><input id="username" type="text" required autocomplete="username"><label>Admin password</label><input id="password" type="password" required autocomplete="current-password"><label>Portfolio slot</label><select id="slot"><option value="project-01.jpg">Project 01 — Posters</option><option value="project-02.jpg">Project 02 — Social Media</option><option value="project-03.jpg">Project 03 — Logos</option><option value="project-04.jpg">Project 04 — Thumbnails</option><option value="project-05.jpg">Project 05 — Other</option><option value="project-06.jpg">Project 06 — Social Media</option></select><label>Design image</label><input id="image" type="file" accept="image/jpeg,image/png,image/webp" required><button type="submit">Upload to Portfolio</button></form><div class="status" id="status">Ready.</div></div><script>const form=document.getElementById('form'),status=document.getElementById('status');form.addEventListener('submit',async e=>{e.preventDefault();const file=document.getElementById('image').files[0];if(!file)return;if(file.size>8*1024*1024){status.textContent='Image is too large. Keep it under 8 MB.';return}status.textContent='Uploading…';const reader=new FileReader();reader.onload=async()=>{try{const r=await fetch('/.netlify/functions/upload-image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value,slot:document.getElementById('slot').value,image:reader.result,contentType:file.type})});status.textContent=r.ok?'Uploaded successfully. Netlify should deploy the change shortly.':'Upload failed: '+await r.text()}catch(err){status.textContent='Connection error. Check Netlify setup.'}};reader.readAsDataURL(file)})</script></body></html>
