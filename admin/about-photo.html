<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RK Creative Studio — About Photo</title><style>*{box-sizing:border-box}body{margin:0;background:#080b12;color:#f4f6fa;font-family:Arial,sans-serif;padding:18px}.card{max-width:560px;margin:8vh auto;background:#111826;border:1px solid #293446;border-radius:18px;padding:22px}h1{margin:0 0 8px;font-size:25px}.hint{color:#9da7b7;line-height:1.6;font-size:13px}label{display:block;color:#aeb8c6;font-size:12px;margin:16px 0 7px}input,button{width:100%;padding:13px;border-radius:9px;border:1px solid #344054;background:#0b1018;color:#fff}button{margin-top:18px;background:#d8b36a;color:#111;font-weight:700;border:0;cursor:pointer}.status{margin-top:14px;padding:12px;border-radius:9px;background:#0b1018;color:#aab3c0;font-size:13px}.preview{width:100%;max-height:430px;object-fit:cover;border-radius:12px;margin-top:18px;display:none}.ok{color:#91e0ad}.err{color:#ff9da8}</style></head><body><div class="card"><h1>About Me — Profile Photo</h1><p class="hint">Upload your real photo here. It will appear in the About Me section of the portfolio. JPG, PNG or WebP; maximum 8 MB.</p><label>Admin ID</label><input id="u" autocomplete="username"><label>Admin password</label><input id="p" type="password" autocomplete="current-password"><label>Your photo</label><input id="f" type="file" accept="image/png,image/jpeg,image/webp"><button id="b">Replace About Photo</button><div id="s" class="status">Ready.</div><img id="preview" class="preview" alt="About photo preview"><p class="hint"><a href="/admin/" style="color:#d8b36a">← Back to Admin Dashboard</a></p></div><script>const $=x=>document.querySelector(x);async function api(o){const r=await fetch('/.netlify/functions/upload-image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});if(!r.ok)throw Error(await r.text()||'Upload failed');return r.json()}$('#b').onclick=()=>{const f=$('#f').files[0],u=$('#u').value.trim(),p=$('#p').value;if(!u||!p||!f){$('#s').textContent='Fill all fields and choose a photo.';$('#s').className='status err';return}if(f.size>8*1024*1024){$('#s').textContent='Photo must be under 8 MB.';$('#s').className='status err';return}const r=new FileReader();r.onload=async()=>{try{await api({username:u,password:p,slot:'about.jpg',image:r.result});$('#preview').src='/assets/about.jpg?v='+Date.now();$('#preview').style.display='block';$('#s').textContent='About photo replaced successfully. Netlify will deploy the change shortly.';$('#s').className='status ok'}catch(e){$('#s').textContent='Upload failed: '+e.message;$('#s').className='status err'}};r.readAsDataURL(f)};</script></body></html>
